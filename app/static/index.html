<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>clipCC</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #f5f5f5;
  color: #1a1a1a;
  line-height: 1.5;
  padding: 2rem 1rem;
}
.container { max-width: 640px; margin: 0 auto; }
h1 { font-size: 1.75rem; margin-bottom: 1.5rem; }
.card {
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  padding: 1.25rem;
  margin-bottom: 1rem;
}
.card h2 { font-size: 1rem; margin-bottom: 0.75rem; color: #333; }
label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 0.25rem; color: #555; }
input[type="text"], input[type="number"], input[type="file"], select {
  width: 100%;
  padding: 0.5rem;
  border: 1px solid #d0d0d0;
  border-radius: 4px;
  font-size: 0.9rem;
  font-family: inherit;
  margin-bottom: 0.75rem;
}
input[type="file"] { padding: 0.35rem; }
select { background: #fff; }
.row { display: flex; gap: 0.75rem; align-items: flex-end; }
.row > * { flex: 1; }
.row > .btn-wrap { flex: 0 0 auto; }
button {
  background: #2563eb;
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 0.5rem 1.1rem;
  font-size: 0.9rem;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
}
button:hover { background: #1d4ed8; }
button:disabled { background: #93b4f5; cursor: not-allowed; }
.status-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; font-size: 0.85rem; color: #555; }
.dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}
.dot-none { background: #ef4444; }
.dot-loading { background: #eab308; }
.dot-loaded { background: #22c55e; }
.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid #ccc;
  border-top-color: #2563eb;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  vertical-align: middle;
  margin-left: 0.4rem;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-msg { color: #dc2626; font-size: 0.85rem; margin-top: 0.5rem; }
.hint { font-size: 0.78rem; color: #888; margin-top: -0.5rem; margin-bottom: 0.75rem; }

/* Results */
#results-section { display: none; }
.result-item { margin-bottom: 0.6rem; }
.result-label-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.2rem; }
.bar-track { background: #e5e7eb; border-radius: 4px; height: 20px; overflow: hidden; }
.bar-fill { background: #2563eb; height: 100%; border-radius: 4px; transition: width 0.4s ease; min-width: 2px; }
.best-match { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.75rem; }
.meta-info { font-size: 0.78rem; color: #888; margin-top: 0.75rem; line-height: 1.6; }
</style>
</head>
<body>
<div class="container">
  <h1>clipCC</h1>

  <!-- Model Section -->
  <div class="card">
    <h2>Model</h2>
    <div class="row">
      <div>
        <label for="model-select">Select model</label>
        <select id="model-select"></select>
      </div>
      <div class="btn-wrap">
        <button id="load-btn" type="button">Load Model</button>
      </div>
    </div>
    <div class="status-row">
      <span class="dot dot-none" id="status-dot"></span>
      <span id="status-text">No model loaded</span>
    </div>
  </div>

  <!-- Classify Form -->
  <div class="card">
    <h2>Classify</h2>
    <label for="video-input">Video file</label>
    <input type="file" id="video-input" accept=".mp4,.avi,.mov,.mkv">

    <label for="labels-input">Labels</label>
    <input type="text" id="labels-input" placeholder='e.g. cat, dog, bird'>
    <p class="hint">Comma-separated (3-10 labels). JSON array also accepted.</p>

    <label for="prompt-input">Prompt template</label>
    <input type="text" id="prompt-input" value="This is a photo of {}.">

    <div class="row">
      <div>
        <label for="fps-input">FPS</label>
        <input type="number" id="fps-input" value="1" min="0.1" max="5" step="0.1">
      </div>
      <div>
        <label for="agg-select">Aggregation</label>
        <select id="agg-select">
          <option value="mean">mean</option>
          <option value="max">max</option>
        </select>
      </div>
    </div>

    <button id="classify-btn" type="button" disabled>Classify</button>
    <div id="classify-error" class="error-msg"></div>
  </div>

  <!-- Results Section -->
  <div class="card" id="results-section">
    <h2>Results</h2>
    <div class="best-match" id="best-match"></div>
    <div id="score-bars"></div>
    <div class="meta-info" id="meta-info"></div>
  </div>
</div>

<script>
(function () {
  var modelSelect = document.getElementById('model-select');
  var loadBtn = document.getElementById('load-btn');
  var statusDot = document.getElementById('status-dot');
  var statusText = document.getElementById('status-text');
  var videoInput = document.getElementById('video-input');
  var labelsInput = document.getElementById('labels-input');
  var promptInput = document.getElementById('prompt-input');
  var fpsInput = document.getElementById('fps-input');
  var aggSelect = document.getElementById('agg-select');
  var classifyBtn = document.getElementById('classify-btn');
  var classifyError = document.getElementById('classify-error');
  var resultsSection = document.getElementById('results-section');
  var bestMatchEl = document.getElementById('best-match');
  var scoreBars = document.getElementById('score-bars');
  var metaInfo = document.getElementById('meta-info');

  var modelLoaded = false;

  function setStatus(state, text) {
    statusDot.className = 'dot dot-' + state;
    statusText.textContent = text;
    if (state === 'loaded') {
      modelLoaded = true;
      classifyBtn.disabled = false;
    }
  }

  function createSpinner() {
    var span = document.createElement('span');
    span.className = 'spinner';
    return span;
  }

  // Fetch models on page load
  fetch('/api/v1/models')
    .then(function (r) { return r.json(); })
    .then(function (models) {
      models.forEach(function (m) {
        var opt = document.createElement('option');
        opt.value = m.model_id;
        opt.textContent = m.display_name + ' (' + m.params + ')';
        modelSelect.appendChild(opt);
        if (m.loaded) {
          opt.selected = true;
          setStatus('loaded', 'Loaded: ' + m.display_name);
        }
      });
    })
    .catch(function () {
      setStatus('none', 'Failed to fetch models');
    });

  // Load model
  loadBtn.addEventListener('click', function () {
    var modelId = modelSelect.value;
    if (!modelId) return;

    loadBtn.disabled = true;
    loadBtn.textContent = 'Loading';
    loadBtn.appendChild(createSpinner());
    setStatus('loading', 'Loading model...');

    fetch('/api/v1/models/load', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model_id: modelId })
    })
      .then(function (r) {
        if (!r.ok) return r.json().then(function (e) { throw new Error(e.detail || 'Load failed'); });
        return r.json();
      })
      .then(function () {
        var selected = modelSelect.options[modelSelect.selectedIndex];
        setStatus('loaded', 'Loaded: ' + selected.textContent);
      })
      .catch(function (err) {
        setStatus('none', 'Error: ' + err.message);
      })
      .finally(function () {
        loadBtn.disabled = false;
        loadBtn.textContent = 'Load Model';
      });
  });

  // Parse labels
  function parseLabels(raw) {
    raw = raw.trim();
    if (!raw) return [];
    if (raw.charAt(0) === '[') {
      try { return JSON.parse(raw); } catch (e) { /* fall through */ }
    }
    return raw.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  }

  // Classify
  classifyBtn.addEventListener('click', function () {
    classifyError.textContent = '';
    resultsSection.style.display = 'none';

    var file = videoInput.files[0];
    if (!file) { classifyError.textContent = 'Please select a video file.'; return; }

    var labels = parseLabels(labelsInput.value);
    if (labels.length < 3 || labels.length > 10) {
      classifyError.textContent = 'Please provide between 3 and 10 labels.';
      return;
    }

    var form = new FormData();
    form.append('video', file);
    form.append('labels', JSON.stringify(labels));
    form.append('prompt_template', promptInput.value);
    form.append('fps', fpsInput.value);
    form.append('aggregation', aggSelect.value);

    classifyBtn.disabled = true;
    classifyBtn.textContent = 'Classifying';
    classifyBtn.appendChild(createSpinner());

    fetch('/api/v1/classify', { method: 'POST', body: form })
      .then(function (r) {
        if (!r.ok) return r.json().then(function (e) { throw new Error(e.detail || 'Classification failed'); });
        return r.json();
      })
      .then(function (data) {
        renderResults(data);
      })
      .catch(function (err) {
        classifyError.textContent = err.message;
      })
      .finally(function () {
        classifyBtn.disabled = false;
        classifyBtn.textContent = 'Classify';
      });
  });

  function renderResults(data) {
    var scores = data.scores.slice().sort(function (a, b) { return b.confidence - a.confidence; });
    var maxConf = scores.length ? scores[0].confidence : 1;

    bestMatchEl.textContent = 'Best match: ' + data.best_match.label +
      ' (' + (data.best_match.confidence * 100).toFixed(1) + '%)';

    // Clear previous results
    while (scoreBars.firstChild) { scoreBars.removeChild(scoreBars.firstChild); }

    scores.forEach(function (s) {
      var pct = maxConf > 0 ? (s.confidence / maxConf) * 100 : 0;

      var item = document.createElement('div');
      item.className = 'result-item';

      var labelRow = document.createElement('div');
      labelRow.className = 'result-label-row';

      var labelSpan = document.createElement('span');
      labelSpan.textContent = s.label;

      var confSpan = document.createElement('span');
      confSpan.textContent = (s.confidence * 100).toFixed(1) + '%';

      labelRow.appendChild(labelSpan);
      labelRow.appendChild(confSpan);

      var track = document.createElement('div');
      track.className = 'bar-track';

      var fill = document.createElement('div');
      fill.className = 'bar-fill';
      fill.style.width = pct.toFixed(1) + '%';

      track.appendChild(fill);
      item.appendChild(labelRow);
      item.appendChild(track);
      scoreBars.appendChild(item);
    });

    var m = data.metadata;
    metaInfo.textContent =
      'Frames: ' + m.frames_analyzed +
      ' | Duration: ' + m.video_duration_seconds.toFixed(1) + 's' +
      ' | Model: ' + m.model +
      ' | Device: ' + m.device +
      ' | Aggregation: ' + m.aggregation +
      ' | Time: ' + m.processing_time_seconds.toFixed(2) + 's';

    resultsSection.style.display = 'block';
  }
})();
</script>
</body>
</html>
