services:
  clipcc-cpu:
    image: ghcr.io/austinjeng/clipcc:latest
    pull_policy: always
    ports:
      - "8000:8000"
    volumes:
      - clipcc-models:/app/models
    environment:
      - MAX_FILE_SIZE_MB=500
      - MAX_DURATION_SECONDS=300
      - MAX_FRAMES=300
      - DEFAULT_FPS=1.0
      - MAX_CONCURRENT_REQUESTS=2
      - ALLOW_UNAUTHENTICATED=true
      - DEFAULT_MODEL_ID=siglip2-base-patch16-256
    profiles: ["cpu"]

  clipcc-cpu-build:
    build:
      context: .
      args:
        TORCH_VARIANT: cpu
    ports:
      - "8000:8000"
    volumes:
      - clipcc-models:/app/models
    environment:
      - MAX_FILE_SIZE_MB=500
      - MAX_DURATION_SECONDS=300
      - MAX_FRAMES=300
      - DEFAULT_FPS=1.0
      - MAX_CONCURRENT_REQUESTS=2
      - ALLOW_UNAUTHENTICATED=true
      - DEFAULT_MODEL_ID=siglip2-base-patch16-256
    profiles: ["cpu-build"]

  clipcc-gpu:
    build:
      context: .
      args:
        TORCH_VARIANT: cu121
    ports:
      - "8000:8000"
    volumes:
      - clipcc-models:/app/models
    environment:
      - MAX_FILE_SIZE_MB=500
      - MAX_DURATION_SECONDS=300
      - MAX_FRAMES=300
      - DEFAULT_FPS=1.0
      - MAX_CONCURRENT_REQUESTS=1
      - ALLOW_UNAUTHENTICATED=true
      - DEFAULT_MODEL_ID=siglip2-so400m-patch14-384
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["gpu"]

volumes:
  clipcc-models:
