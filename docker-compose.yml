services:
  clipcc-cpu:
    image: ghcr.io/austinjeng/clipcc:latest
    pull_policy: always
    ports:
      - "8000:8000"
    volumes:
      - clipcc-models:/app/models
    environment:
      - MAX_FILE_SIZE_MB=500
      - MAX_DURATION_SECONDS=300
      - MAX_FRAMES=300
      - DEFAULT_FPS=1.0
      - MAX_CONCURRENT_REQUESTS=2
      - ALLOW_UNAUTHENTICATED=true
      - DEFAULT_MODEL_ID=siglip2-base-patch16-256
      # Gemma 4 E2B / hybrid mode is GPU-only in practice (CPU = fp32 ≈22GB resident).
      - GEMMA_ENABLED=false
    profiles: ["cpu"]

  clipcc-cpu-build:
    build:
      context: .
      args:
        TORCH_VARIANT: cpu
    ports:
      - "8000:8000"
    volumes:
      - clipcc-models:/app/models
    environment:
      - MAX_FILE_SIZE_MB=500
      - MAX_DURATION_SECONDS=300
      - MAX_FRAMES=300
      - DEFAULT_FPS=1.0
      - MAX_CONCURRENT_REQUESTS=2
      - ALLOW_UNAUTHENTICATED=true
      - DEFAULT_MODEL_ID=siglip2-base-patch16-256
      # Gemma 4 E2B / hybrid mode is GPU-only in practice (CPU = fp32 ≈22GB resident).
      - GEMMA_ENABLED=false
    profiles: ["cpu-build"]

  clipcc-gpu:
    build:
      context: .
      args:
        TORCH_VARIANT: cu126
    ports:
      - "8000:8000"
    volumes:
      - clipcc-models:/app/models
    environment:
      - MAX_FILE_SIZE_MB=500
      - MAX_DURATION_SECONDS=300
      - MAX_FRAMES=300
      - DEFAULT_FPS=1.0
      - MAX_CONCURRENT_REQUESTS=1
      - ALLOW_UNAUTHENTICATED=true
      - DEFAULT_MODEL_ID=siglip2-so400m-patch14-384
      # GPU loads Gemma at bf16 (~11.4GB VRAM); warm on demand via POST /api/v1/gemma/warm.
      - GEMMA_ENABLED=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["gpu"]

volumes:
  clipcc-models:
