name: Docker CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          build-args: TORCH_VARIANT=cpu
          tags: clipcc:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot smoke test
        run: |
          docker run -d --name smoke \
            -p 8000:8000 \
            -e ALLOW_UNAUTHENTICATED=true \
            -e SKIP_MODEL_AUTOLOAD=true \
            clipcc:ci-test

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/live > /dev/null 2>&1; then
              echo "Smoke test passed: /live returned 200"
              exit 0
            fi
            sleep 2
          done

          echo "Smoke test failed: /live did not return 200 within 60s"
          docker logs smoke
          exit 1

      - name: Tear down
        if: always()
        run: docker rm -f smoke 2>/dev/null || true
